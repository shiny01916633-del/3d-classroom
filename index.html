<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3D프린터 필기 클래스룸</title>
<link rel="icon" href="icon.png">
</head>
<body>
<title>3D프린터 필기 클래스룸</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: classroom home (chapter list) → CBT exam screen (question pane + OMR answer sheet) → result review; teacher dashboard behind #teacher */
:root{
  --bg:#eef1f5; --paper:#ffffff; --paper-2:#f6f8fb; --ink:#18222f; --ink-2:#4a5767; --line:#d6dde6;
  --navy:#1d3557; --navy-ink:#ffffff; --accent:#2b6cb0; --omr:#c2410c; --omr-soft:#fde7dc;
  --ok:#15803d; --ok-soft:#dcfce7; --bad:#b91c1c; --bad-soft:#fee2e2; --warn:#a16207; --warn-soft:#fef3c7;
  --f-head:"IBM Plex Sans KR","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-body:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --qsize:1.12rem; --radius:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f141b; --paper:#18202b; --paper-2:#1e2733; --ink:#e6ebf1; --ink-2:#a3afbd; --line:#2d3947;
  --navy:#20324d; --navy-ink:#f1f5f9; --accent:#6aa7e8; --omr:#fb8a4f; --omr-soft:#3a2418;
  --ok:#4ade80; --ok-soft:#14321f; --bad:#f87171; --bad-soft:#3b1a1a; --warn:#facc15; --warn-soft:#3a3214; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f141b; --paper:#18202b; --paper-2:#1e2733; --ink:#e6ebf1; --ink-2:#a3afbd; --line:#2d3947;
  --navy:#20324d; --navy-ink:#f1f5f9; --accent:#6aa7e8; --omr:#fb8a4f; --omr-soft:#3a2418;
  --ok:#4ade80; --ok-soft:#14321f; --bad:#f87171; --bad-soft:#3b1a1a; --warn:#facc15; --warn-soft:#3a3214; color-scheme:dark}
:root[data-qsize="s"]{--qsize:1rem} :root[data-qsize="l"]{--qsize:1.3rem}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--navy)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:1100px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-head);text-wrap:balance;margin:0;line-height:1.3}
.muted{color:var(--ink-2)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.btn{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:.5rem .95rem;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--navy);color:var(--navy-ink);border-color:var(--navy)}
.btn.primary:hover{filter:brightness(1.15)}
.btn.omr{background:var(--omr);border-color:var(--omr);color:#fff}
.btn:disabled{opacity:.5;cursor:not-allowed}
.pill{display:inline-flex;align-items:center;gap:.3rem;border-radius:99px;padding:.1rem .6rem;font-size:.8rem;font-weight:600;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.plain{background:var(--paper-2);color:var(--ink-2);border:1px solid var(--line)}

/* top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--navy);color:var(--navy-ink)}
.topbar .wrap{display:flex;align-items:center;gap:1rem;padding-block:.7rem;flex-wrap:wrap}
.brand{font-family:var(--f-head);font-weight:700;font-size:1.05rem;letter-spacing:-.01em;display:flex;align-items:center;gap:.55rem}
.brand .mark{width:26px;height:26px;border-radius:6px;background:var(--omr);display:grid;place-items:center;font-family:var(--f-mono);font-size:.75rem;color:#fff}
.topbar .spacer{flex:1}
.topbar .link{background:transparent;border:1px solid rgba(255,255,255,.35);color:var(--navy-ink);border-radius:7px;padding:.3rem .75rem;font-size:.88rem}
.topbar .link[aria-current="page"]{background:rgba(255,255,255,.16)}

/* home */
.home{padding-block:1.6rem 3rem;display:grid;gap:1.4rem}
.intro{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:1.2rem;align-items:end}
.intro h1{font-size:clamp(1.45rem,3.2vw,2rem);letter-spacing:-.02em}
.intro p{margin:.4rem 0 0;max-width:60ch}
.who{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:1rem;display:grid;gap:.5rem}
.who label{font-weight:600;font-size:.9rem}
.who input{width:100%;padding:.55rem .7rem;border:1px solid var(--line);border-radius:8px;background:var(--paper-2)}
.who .status{font-size:.82rem}
.chapters{display:grid;gap:1rem}
.chap{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:1.1rem 1.1rem 1rem;display:grid;gap:.9rem}
.chead{display:flex;justify-content:space-between;align-items:flex-start;gap:.6rem 1rem;flex-wrap:wrap}
.chead h2{margin:.15rem 0 .2rem}
.parts{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:.6rem}
.part{border:1px solid var(--line);background:var(--paper-2);border-radius:8px;padding:.65rem .75rem;display:grid;gap:.5rem}
.part.done{border-color:color-mix(in srgb,var(--ok) 45%,var(--line))}
.part .ptop{display:flex;justify-content:space-between;align-items:baseline;gap:.4rem}
.part .pfoot{display:flex;justify-content:space-between;align-items:center;gap:.4rem;flex-wrap:wrap}
.btn.sm{padding:.3rem .7rem;font-size:.85rem}
a.btn{text-decoration:none;color:inherit;display:inline-block}
.gatewrap{display:grid;place-items:center;min-height:calc(100vh - 60px);padding-block:2rem}
.gate{background:var(--paper);border:1px solid var(--line);border-top:5px solid var(--omr);border-radius:var(--radius);padding:1.6rem 1.5rem;width:100%;max-width:420px;display:grid;gap:.55rem}
.gate .eyebrow{font-family:var(--f-mono);font-size:.75rem;color:var(--omr);letter-spacing:.06em;font-weight:600}
.gate h1{font-size:1.6rem;letter-spacing:-.02em}
.gate label{font-weight:600;font-size:.9rem;margin-top:.4rem}
.gate input{width:100%;padding:.65rem .75rem;border:1px solid var(--line);border-radius:8px;background:var(--paper-2);font-size:1rem}
.gate #g-code:not(:placeholder-shown){font-family:var(--f-mono);letter-spacing:.08em;text-transform:uppercase}
.gate .btn{margin-top:.6rem;padding:.7rem;font-size:1rem}
.seg.roleseg{display:grid;grid-template-columns:1fr 1fr;margin:.3rem 0 .2rem;width:100%}
.seg.roleseg button{padding:.65rem .5rem;font-size:1rem;font-weight:600}
.gate-err{color:var(--bad);font-size:.88rem;min-height:1.2em}
.refresh{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:1rem}
.mode{display:grid;gap:.55rem;text-align:left;background:var(--paper);border:1px solid var(--line);border-top:5px solid var(--navy);border-radius:var(--radius);padding:1.3rem 1.3rem 1.1rem}
.mode+.mode{border-top-color:var(--omr)}
.mode:hover{border-color:var(--accent)}
.mode .eyebrow{font-family:var(--f-mono);font-size:.78rem;color:var(--omr);letter-spacing:.06em;font-weight:600}
.mode .mtitle{font-family:var(--f-head);font-weight:700;font-size:1.5rem;letter-spacing:-.02em}
.mode .desc{color:var(--ink-2);font-size:.92rem}
.mode .meta{display:flex;gap:.4rem;flex-wrap:wrap}
.mode .go{font-weight:600;color:var(--accent);margin-top:.2rem}
.mockgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:.8rem}
.part.mock{background:var(--paper);padding:.9rem 1rem}
.part.mock .mtitle{font-family:var(--f-head);font-size:1.15rem}
.chbreak{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:.4rem .8rem;margin-top:.4rem}
.chbreak .cb{display:grid;grid-template-columns:auto auto;justify-content:space-between;gap:.15rem .5rem;font-size:.85rem}
.chbreak .bar{grid-column:1/-1;height:.4rem;background:var(--paper-2);border:1px solid var(--line);border-radius:99px;overflow:hidden}
.chbreak .bar i{display:block;height:100%;background:var(--accent)}
.chap .eyebrow{font-family:var(--f-mono);font-size:.78rem;color:var(--omr);letter-spacing:.06em;font-weight:600}
.chap h2{font-size:1.15rem}
.chap .desc{font-size:.88rem;color:var(--ink-2);margin:0}
.chap .meta{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;font-size:.85rem}
.chap .foot{display:flex;align-items:center;justify-content:space-between;gap:.6rem;flex-wrap:wrap;border-top:1px dashed var(--line);padding-top:.75rem}
.score-chip{font-family:var(--f-mono);font-weight:600}
.notice{background:var(--paper);border:1px solid var(--line);border-left:4px solid var(--warn);border-radius:8px;padding:.7rem .9rem;font-size:.88rem}

/* exam */
.exam{display:grid;grid-template-rows:auto 1fr auto;min-height:calc(100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
.exam-head{background:var(--paper);border-bottom:1px solid var(--line)}
.exam-head .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:.6rem 1.2rem;padding-block:.6rem}
.exam-head .title{font-family:var(--f-head);font-weight:700}
.exam-head .info{display:flex;gap:1rem;flex-wrap:wrap;font-size:.88rem;color:var(--ink-2)}
.exam-head .info b{color:var(--ink);font-weight:600}
.timer{font-family:var(--f-mono);font-size:1.15rem;font-weight:600;background:var(--paper-2);border:1px solid var(--line);border-radius:8px;padding:.15rem .6rem}
.timer.low{color:var(--bad);border-color:var(--bad)}
.sizebtns{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.sizebtns button{border:0;background:var(--paper);padding:.2rem .55rem;font-size:.85rem}
.sizebtns button[aria-pressed="true"]{background:var(--navy);color:var(--navy-ink)}
.exam-body .wrap{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:1rem;padding-block:1rem;align-items:start}
.qpane{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:1.4rem 1.5rem;min-height:420px;min-width:0}
.qsrc{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap;margin-bottom:.8rem}
.qno{font-family:var(--f-mono);font-weight:600;font-size:1.25rem;color:var(--omr)}
.qtext{font-size:var(--qsize);font-weight:500;margin:0 0 1rem;line-height:1.65;word-break:keep-all}
.qbox{border:1px solid var(--line);background:var(--paper-2);border-radius:8px;padding:.75rem .95rem;margin:0 0 1rem;white-space:pre-line;font-size:calc(var(--qsize)*.92)}
.qfig{margin:0 0 1rem;background:#fff;border:1px solid var(--line);border-radius:8px;padding:.6rem;display:flex;justify-content:center}
.qfig img{max-height:340px;width:auto;max-width:100%;object-fit:contain}
.choices{display:grid;gap:.55rem;list-style:none;padding:0;margin:0}
.choice{display:flex;gap:.75rem;align-items:flex-start;width:100%;text-align:left;border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:.65rem .8rem;font-size:var(--qsize);line-height:1.5;word-break:keep-all}
.choice:hover{border-color:var(--accent)}
.choice .num{flex:none;width:1.65em;height:1.65em;border-radius:50%;border:1.5px solid var(--ink-2);display:grid;place-items:center;font-family:var(--f-mono);font-size:.8em;font-weight:600;margin-top:.05em}
.choice[aria-checked="true"]{border-color:var(--omr);background:var(--omr-soft)}
.choice[aria-checked="true"] .num{background:var(--omr);border-color:var(--omr);color:#fff}
.omr{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);position:sticky;top:calc(env(safe-area-inset-top,0px) + .8rem);max-height:calc(100vh - 7rem);display:flex;flex-direction:column}
.omr-head{padding:.7rem .9rem;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:.5rem}
.omr-head h3{font-size:.95rem}
.omr-list{overflow:auto;padding:.4rem .5rem .6rem}
.omr-row{display:grid;grid-template-columns:2.6rem repeat(4,1fr);align-items:center;gap:.15rem;padding:.12rem .25rem;border-radius:6px}
.omr-row.cur{background:var(--paper-2);outline:1px solid var(--accent)}
.omr-row .n{font-family:var(--f-mono);font-size:.82rem;color:var(--ink-2);border:0;background:none;text-align:left;padding:.1rem}
.omr-row .b{width:1.45rem;height:1.45rem;border-radius:50%;border:1.3px solid var(--line);background:transparent;font-family:var(--f-mono);font-size:.7rem;color:var(--ink-2);justify-self:center;padding:0}
.omr-row .b.on{background:var(--omr);border-color:var(--omr);color:#fff}
.exam-foot{background:var(--paper);border-top:1px solid var(--line);position:sticky;bottom:0;padding-bottom:env(safe-area-inset-bottom,0px)}
.exam-foot .wrap{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap;padding-block:.6rem}
.exam-foot .spacer{flex:1}
.omr-toggle{display:none}

/* modal */
.modal{position:fixed;inset:0;background:rgba(10,15,25,.55);display:grid;place-items:center;z-index:20;padding:1rem}
.modal .box{background:var(--paper);border-radius:12px;max-width:420px;width:100%;padding:1.3rem;display:grid;gap:.8rem;border:1px solid var(--line)}
.modal .row{display:flex;justify-content:flex-end;gap:.5rem;flex-wrap:wrap}

/* result */
.result{padding-block:1.5rem 3rem;display:grid;gap:1.2rem}
.scorecard{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:1.3rem;display:grid;grid-template-columns:auto minmax(0,1fr);gap:1.4rem;align-items:center}
.bigscore{font-family:var(--f-mono);font-size:3.2rem;font-weight:600;line-height:1}
.bigscore small{font-size:1rem;color:var(--ink-2)}
.scorecard .lines{display:grid;gap:.35rem}
.filters{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--paper);padding:.35rem .8rem;font-size:.88rem}
.seg button[aria-pressed="true"]{background:var(--navy);color:var(--navy-ink)}
.review{display:grid;gap:.8rem}
.rv{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:1rem 1.1rem;display:grid;gap:.6rem;min-width:0}
.rv.wrong{border-left:4px solid var(--bad)} .rv.right{border-left:4px solid var(--ok)}
.rv .qtext{font-size:1rem;margin:0}
.rv .qbox{font-size:.92rem;margin:0}
.rv .qfig{margin:0}
.rv ol{list-style:none;padding:0;margin:0;display:grid;gap:.25rem}
.rv li{display:flex;gap:.55rem;align-items:flex-start;padding:.25rem .45rem;border-radius:6px;font-size:.95rem}
.rv li .num{flex:none;font-family:var(--f-mono);font-weight:600;width:1.4rem}
.rv li.correct{background:var(--ok-soft);color:var(--ok);font-weight:600}
.rv li.picked{background:var(--bad-soft);color:var(--bad)}
.rv .exp{background:var(--paper-2);border-radius:8px;padding:.6rem .8rem;font-size:.9rem}
.rv .exp b{color:var(--accent)}

/* teacher */
.teacher{padding-block:1.5rem 3rem;display:grid;gap:1.2rem}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:1rem 1.1rem;min-width:0}
.panel-head{display:flex;justify-content:space-between;align-items:center;gap:.6rem;flex-wrap:wrap;margin-bottom:.8rem}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{padding:.5rem .6rem;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{font-family:var(--f-head);font-weight:600;font-size:.82rem;color:var(--ink-2);background:var(--paper-2)}
table.scores th,table.scores td{padding:.45rem .4rem}
.stick{position:sticky;left:0;background:var(--paper);z-index:1}
th.stick{background:var(--paper-2)}
.chg{border-left:2px solid var(--line)}
td.num,th.num{text-align:center;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
td .cellbtn{border:0;background:none;padding:.1rem .3rem;border-radius:5px;font-family:var(--f-mono);font-weight:600}
td .cellbtn:hover{background:var(--paper-2)}
.sc-hi{color:var(--ok)} .sc-lo{color:var(--bad)}
.namebtn{border:0;background:none;padding:0;font-weight:600;color:var(--accent);text-decoration:underline;text-underline-offset:3px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.8rem}
.stat{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:.8rem 1rem}
.stat .v{font-family:var(--f-mono);font-size:1.6rem;font-weight:600}
.stat .k{font-size:.82rem;color:var(--ink-2)}
.qstat{display:grid;grid-template-columns:5.5rem minmax(0,1fr) 9rem;gap:.8rem;align-items:center;padding:.5rem 0;border-bottom:1px solid var(--line);font-size:.9rem}
.qstat .bar{height:.55rem;background:var(--paper-2);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.qstat .bar i{display:block;height:100%;background:var(--bad)}
.qstat .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qstat .r{font-family:var(--f-mono);text-align:right;font-variant-numeric:tabular-nums}
.empty{padding:2rem 1rem;text-align:center;color:var(--ink-2)}
.detail{display:grid;gap:.8rem}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(1rem + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:.55rem 1rem;border-radius:8px;z-index:30;font-size:.9rem}

@media (max-width:860px){
  .intro{grid-template-columns:1fr}
  .exam-body .wrap{grid-template-columns:minmax(0,1fr)}
  .omr{position:fixed;inset:auto 0 0 0;top:auto;max-height:65vh;border-radius:14px 14px 0 0;z-index:15;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
  .omr:not(.open){display:none}
  .omr-toggle{display:inline-block}
  .qpane{padding:1.1rem}
  .scorecard{grid-template-columns:1fr}
  .qstat{grid-template-columns:4.5rem minmax(0,1fr) 6.5rem}
}
@media (prefers-reduced-motion:no-preference){.choice,.btn,.omr-row .b{transition:background-color .12s,border-color .12s}}
</style>

<header class="topbar">
  <div class="wrap">
    <div class="brand"><span class="mark">3D</span>3D프린터운용기능사 필기 클래스룸</div>
    <div class="spacer"></div>
    <nav id="nav" style="display:flex;gap:.5rem">
      <button class="link" id="nav-home" type="button">처음 화면</button>
      <button class="link" id="nav-teacher" type="button" hidden>선생님 화면</button>
    </nav>
  </div>
</header>

<main id="app">
  <div class="wrap home"><p class="muted">문제를 불러오는 중…</p></div>
</main>

<div id="modal-root"></div>

<script>
(function(){
"use strict";
const CHAPTERS=[
 {n:1,t:"제품 스캐닝 · 3D프린팅 방식",d:"3D 스캐너의 종류와 정합·역설계, FDM·SLA·SLS 등 출력 방식과 활용 분야"},

/* Server calls go to the Google Apps Script functions in Code.gs */
/* On GitHub the page talks to the Google script by URL, without sending any Google login cookies */
const API_URL="https://script.google.com/macros/s/AKfycbxNOXQV3baFsPEFSIR9MESV8PnUQ3onMZOQ9wVcJ4xaTVyrWuKHFEgDMawsIJl2UbCD9A/exec";
async function apiFetch(fn,args){
  const r=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({fn,args}),credentials:"omit",redirect:"follow"});
  if(!r.ok)throw new Error("HTTP "+r.status);
  const j=await r.json();
  if(!j.ok)throw new Error(j.error||"ERR");
  return j.data;
}
function api(fn,...args){
  if(API_URL)return apiFetch(fn,args);
  return new Promise((res,rej)=>{const g=window.google&&google.script&&google.script.run;if(!g)return rej(new Error("NO_SERVER"));g.withSuccessHandler(res).withFailureHandler(rej)[fn](...args)});
}
function normName(s){return String(s||"").replace(/\s+/g,"")}
const S={code:null,role:null,qs:[],byCh:{},parts:[],mocks:[],partById:{},tSet:"chapters",db:null,user:null,uid:null,isTeacher:false,canWrite:null,mine:null,subs:null,subsErr:null,exam:null,result:null,view:"home",tView:"scores",tPart:"1-1",tStudent:null};
/* Split a chapter's question count into parts of about 20:
   fill 20s; a remainder under 5 joins the last part, under 15 is balanced with the previous part. */
function partSizes(n){
  if(n<=PART_SIZE+4)return [n];
  const k=Math.ceil(n/PART_SIZE),rem=n-PART_SIZE*(k-1);
  const s=new Array(k-1).fill(PART_SIZE);
  if(rem<5){s[s.length-1]+=rem}
  else if(rem<15){const t=PART_SIZE+rem,a=Math.floor(t/2);s[s.length-1]=a;s.push(t-a)}
  else s.push(rem);
  return s;
}
function partLabel(p){return p.mock?"모의고사 "+p.m+"회":p.ch+"단원 파트 "+p.p}
function setTitle(p){return p.mock?"모의고사 제"+p.m+"회 · "+p.qs.length+"문항":"제"+p.ch+"단원 파트 "+p.p+" · "+CHAPTERS[p.ch-1].t}
/* Fixed-seed shuffle so every student gets the same mock exam. */
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return ((t^t>>>14)>>>0)/4294967296}}
function shuffled(arr,seed){const a=arr.slice(),r=rng(seed);for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
/* Mocks 1–8 split all 480 questions once each (chapter mix kept even by dealing in turn);
   mocks 9–10 draw a fresh 60 from the whole pool with the same chapter mix. */
function buildMocks(){
  const full=Math.floor(S.qs.length/MOCK_SIZE);
  const deck=CHAPTERS.flatMap(c=>shuffled(S.byCh[c.n],1000+c.n));
  const sets=Array.from({length:full},()=>[]);
  deck.forEach((q,i)=>sets[i%full].push(q));
  for(let m=full+1;m<=MOCK_COUNT;m++){
    const s=[];for(const c of CHAPTERS){const k=sets[0].filter(q=>q.ch===c.n).length;s.push(...shuffled(S.byCh[c.n],m*100+c.n).slice(0,k))}
    sets.push(s);
  }
  sets.slice(0,MOCK_COUNT).forEach((s,i)=>{const p={id:"M"+(i+1),mock:true,m:i+1,time:MOCK_TIME,qs:shuffled(s,7000+i)};S.mocks.push(p);S.partById[p.id]=p});
}

function el(tag,attrs,...kids){const e=document.createElement(tag);if(attrs)for(const k in attrs){const v=attrs[k];if(v==null||v===false)continue;if(k==="class")e.className=v;else if(k==="text")e.textContent=v;else if(k.startsWith("on"))e.addEventListener(k.slice(2),v);else e.setAttribute(k,v===true?"":v)}for(const c of kids.flat()){if(c==null||c===false)continue;e.append(c instanceof Node?c:document.createTextNode(String(c)))}return e}
function lsGet(k){try{const v=localStorage.getItem(k);return v?JSON.parse(v):null}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function lsDel(k){try{localStorage.removeItem(k)}catch(e){}}
/* Name and invite code live only while this window is open: closing the window means entering the code again */
function ssGet(k){try{const v=sessionStorage.getItem(k);return v?JSON.parse(v):null}catch(e){return null}}
function ssSet(k,v){try{sessionStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function ssDel(k){try{sessionStorage.removeItem(k)}catch(e){}}
/* Unfinished quizzes are kept per student name, so several students can share one computer */
function draftKey(id){return "cbt-draft-"+normName(studentName())+"-"+id}
function fmtTime(s){s=Math.max(0,Math.floor(s));const m=Math.floor(s/60),r=s%60;return String(m).padStart(2,"0")+":"+String(r).padStart(2,"0")}

/* Questions arrive from Google only after a valid code (students get them without answers) */
function buildSets(qs){
  S.qs=qs.slice().sort((a,b)=>a.y.localeCompare(b.y)||a.n-b.n);
  S.byCh={};S.parts=[];S.mocks=[];S.partById={};
  for(const c of CHAPTERS){
    const cq=S.qs.filter(q=>q.ch===c.n);S.byCh[c.n]=cq;
    let off=0;partSizes(cq.length).forEach((sz,i)=>{const p={id:c.n+"-"+(i+1),ch:c.n,p:i+1,time:TIME_SEC,qs:cq.slice(off,off+sz)};off+=sz;S.parts.push(p);S.partById[p.id]=p});
  }
  buildMocks();
}
function enter(code,role,qs){
  S.code=code;S.role=role;S.isTeacher=role==="teacher";
  buildSets(qs||[]);
  goList("home");
  loadMine();
  if(S.isTeacher)loadAll();
}
/* Student's own past results → {ch:{setId:{score,attempts,best,...}}} */
function summarize(rows){
  const ch={};
  rows.slice().sort((a,b)=>String(a.at).localeCompare(String(b.at))).forEach(r=>{
    if(!S.partById[r.setId])return;
    const prev=ch[r.setId];
    ch[r.setId]={score:r.score,correct:r.correct,total:r.total,answers:r.answers,durationSec:r.durationSec,submittedAt:r.at,attempts:(prev?prev.attempts:0)+1,best:Math.max(r.score,prev?prev.best:0)};
  });
  return ch;
}
async function loadMine(){
  if(!S.code)return;
  try{const rows=await api("myResults",S.code,studentName());S.mine={ch:summarize(rows)};rerenderList()}
  catch(e){if(e&&/CODE/.test(e.message||""))codeExpired();return}
  loadDrafts();
}
/* Unfinished quizzes saved on Google under this name → bring them to this computer (the newer copy wins) */
async function loadDrafts(){
  let list;
  try{list=await api("myDrafts",S.code,studentName())}catch(e){console.warn("draft load failed",e);return}
  let changed=false;
  /* A quiz submitted later on another computer → drop this computer's older unfinished copy */
  for(const id in (S.mine&&S.mine.ch)||{}){const l=lsGet(draftKey(id));if(l&&(l.saved||0)<new Date(S.mine.ch[id].submittedAt).getTime()){lsDel(draftKey(id));changed=true}}
  for(const d of list||[]){
    const p=S.partById[d.setId];if(!p||S.mine&&S.mine.ch&&S.mine.ch[d.setId]&&new Date(S.mine.ch[d.setId].submittedAt).getTime()>=d.saved)continue;
    const local=lsGet(draftKey(d.setId));
    if(local&&(local.saved||0)>=d.saved)continue;
    const answers=String(d.answers||"").padEnd(p.qs.length,"0").slice(0,p.qs.length).split("").map(Number);
    lsSet(draftKey(d.setId),{answers,idx:Math.min(d.idx||0,p.qs.length-1),remain:Math.max(1,Number(d.remain)||p.time),started:Date.now(),saved:d.saved});
    changed=true;
  }
  if(changed)rerenderList();
}

  }

  if(draft&&draft.answers&&draft.answers.length===qs.length){ex={n,qs,answers:draft.answers,idx:draft.idx||0,remain:draft.remain,started:draft.started||Date.now()}}
  else ex={n,qs,answers:new Array(qs.length).fill(0),idx:0,remain:total,started:Date.now()};

}

  const sel=el("select",{id:"t-ch",class:"btn","aria-label":"파트 선택",onchange:e=>{S.tPart=e.target.value;renderTeacher()}},el("optgroup",{label:"모의고사"},S.mocks.map(optOf)),CHAPTERS.map(c=>el("optgroup",{label:c.n+"단원 · "+c.t},S.parts.filter(p=>p.ch===c.n).map(p=>el("option",{value:p.id,selected:S.tPart===p.id,text:partLabel(p)+" ("+p.qs.length+"문항, "+R.filter(r=>r.ch[p.id]).length+"명 제출)"})))));
  p.append(el("div",{class:"panel-head"},el("h2",{style:"font-size:1.1rem",text:"문항별 오답률"}),sel));
  const qs=(S.partById[S.tPart]||S.parts[0]).qs;
  const subs=R.map(r=>r.ch[S.tPart]).filter(Boolean);
  if(!subs.length){p.append(el("div",{class:"empty",text:"이 파트를 제출한 학생이 아직 없어요."}));return p}
  p.append(el("p",{class:"muted",style:"margin:0 0 .6rem;font-size:.88rem",text:subs.length+"명 제출 기준 · 오답률이 높은 문제부터 보여 줘요. 문제를 누르면 내용과 해설이 펼쳐져요."}));
  const stat=qs.map((q,i)=>{let wrong=0;const picks=[0,0,0,0,0];subs.forEach(s=>{const a=+(s.answers||"")[i]||0;picks[a]++;if(a!==q.a)wrong++});return {q,i,wrong,rate:wrong/subs.length,picks}}).sort((a,b)=>b.rate-a.rate||a.i-b.i);
  for(const s of stat){
    const d=el("details",{});
    d.append(el("summary",{class:"qstat",style:"cursor:pointer"},el("span",{class:"mono",text:s.q.y+"-"+String(s.q.n).padStart(2,"0")}),el("span",{class:"t",text:s.q.q}),el("span",{style:"display:grid;gap:.2rem"},el("span",{class:"r",text:Math.round(s.rate*100)+"% ("+s.wrong+"명)"}),el("span",{class:"bar"},el("i",{style:"width:"+Math.round(s.rate*100)+"%"})))));
    const pickLine=el("div",{class:"muted",style:"font-size:.85rem",text:"선택 분포: "+[1,2,3,4].map(k=>NUM[k-1]+" "+s.picks[k]+"명").join(" · ")+(s.picks[0]?" · 안 품 "+s.picks[0]+"명":"")});
    d.append(el("div",{style:"padding:.6rem 0 1rem"},pickLine,reviewItem(s.q,0,s.i)));
    p.append(d);
  }
  return p;
}
async function downloadCsv(){
  const R=rows();
  const esc=v=>{v=String(v??"");return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
  const all=S.mocks.concat(S.parts);
  const head=["학생"].concat(all.flatMap(p=>[partLabel(p)+" 점수",partLabel(p)+" 응시횟수"]),["마지막 제출"]);
  const lines=[head.map(esc).join(",")];
  for(const r of R){const row=[r.name||""];for(const p of all){const e=r.ch[p.id];row.push(e?e.score:"",e?(e.attempts||1):"")}row.push(fmtDate(r.updatedAt));lines.push(row.map(esc).join(","))}
  try{
    const url=URL.createObjectURL(new Blob(["﻿"+lines.join("\r\n")],{type:"text/csv;charset=utf-8"}));
    const a=el("a",{href:url,download:"3D프린터_퀴즈_결과.csv"});document.body.append(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),5000);
  }catch(e){toast("내려받기가 안 되면 ‘구글 시트 열기’에서 바로 보세요.")}
}

/* ---------- nav / routing ---------- */
function setNav(){
  const h=document.getElementById("nav-home"),t=document.getElementById("nav-teacher");
  t.hidden=!S.isTeacher;
  h.setAttribute("aria-current",S.view==="home"?"page":"false");
  t.setAttribute("aria-current",S.view==="teacher"?"page":"false");
  document.getElementById("nav").hidden=S.view==="exam"||S.view==="gate";
}
document.getElementById("nav-home").addEventListener("click",()=>goList("home"));
document.getElementById("nav-teacher").addEventListener("click",()=>{if(!S.isTeacher)return;S.result=null;window.scrollTo(0,0);renderTeacher();loadAll()});
/* Teacher screen refreshes itself every 30 seconds */
setInterval(()=>{if(S.view==="teacher"&&S.isTeacher&&!S.subsLoading&&!document.hidden)loadAll()},30000);

/* ---------- boot ---------- */
async function boot(){
  const sz=lsGet("cbt-size");if(sz&&sz!=="m")document.documentElement.setAttribute("data-qsize",sz);
  /* Older versions remembered the code on the device forever; forget it */
  lsDel("cbt-code");lsDel("cbt-name");
  /* Code is kept only for this open window (so a refresh keeps you in); a new window shows the entry screen */
  const code=ssGet("cbt-code");
  if(!code)return renderGate();
  app.replaceChildren(el("div",{class:"wrap home"},el("p",{class:"muted",text:"문제를 불러오는 중…"})));
  try{const r=await api("enterClass",code);if(r&&r.role)return enter(code,r.role,r.qs);ssDel("cbt-code");renderGate("초대코드가 바뀌었어요. 선생님께 새 코드를 받아 다시 입장하세요.")}
  catch(e){renderGate("연결이 잠깐 끊겼어요. 다시 입장해 주세요.")}
}
boot();
})();
